services:
  nginx:
    build: 
      context: .
      dockerfile: public/Docker/Dockerfile
    container_name: nginx
    ports:
      - "8082:80"
    volumes: 
      - .:/var/www/html/todo
      - ./public/Docker/todo.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
     - todo-network  
    
  app:
    build: 
      context: .
      dockerfile: Dockerfile
    container_name: php
    networks:
      - todo-network
    environment:
      DB_HOST: 172.16.31.92
      DB_CONNECTION: mysql
      DB_PORT: 3306
      DB_DATABASE: todoapp
      DB_USERNAME: homestead
      DB_PASSWORD: todoapp786@
    depends_on:
      - db
    command: bash -c "php artisan key:generate && php artisan optimize && php artisan migrate && php-fpm"

  # unhash and above depends_on this if you want to use mysql container in same server 
  
  db:
    image: mysql:5.7
    environment:
      MYSQL_DATABASE: todoapp
      MYSQL_USER: homestead
      MYSQL_PASSWORD: todoapp786@
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    networks:
      - todo-network

networks:
  todo-network:
    driver: bridge  
