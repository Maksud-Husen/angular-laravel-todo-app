---
- name: Create database 
  mysql_db:
    name: todoapp
    state: present
    
- name: create user
  mysql_user:
    name: homestead
    password: todoapp786@
    host: 172.16.31.78
    priv: 'todoapp.*:ALL'
    state: present

- name: firewall rule to allow app server to connect to db server
  community.general.ufw:
    rule: allow
    port: 3306
    proto: tcp
    from_ip: 172.16.31.78
  
- name: restart mysql service
  service:
    name: mysql
    state: restarted 


