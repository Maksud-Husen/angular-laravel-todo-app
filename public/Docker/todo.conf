    server {
        listen 80;
        server_name 172.16.31.92; #you can change this to your domain ip from where you want app to run in

        root   /var/www/html/todo/public;
        index  index.php index.html index.htm;

        access_log /var/log/nginx/access.log;
        error_log /var/log/nginx/error.log;

        location / {
            try_files $uri $uri/ /index.php?$query_string;
        }
        
        location ~ \.php$ {

        #    include snippets/fastcgi-php.conf; because this is not in official nginx from docker

            fastcgi_pass php:9000;
            fastcgi_index index.php;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            include fastcgi_params;
        }

        location ~ /\.ht {
            deny all;
        }
    }